name: Keep Render Server Alive

on:
  schedule:
    # Runs every 14 minutes (Render sleeps after 15 min of inactivity)
    - cron: '*/14 * * * *'
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Server
        run: |
          URL="${{ secrets.RENDER_SERVER_URL }}"
          if [ -z "$URL" ]; then
            URL="${{ vars.RENDER_SERVER_URL }}"
          fi
          if [ -z "$URL" ]; then
            URL="https://tamilmv-4vej.onrender.com"
          fi

          # Strip trailing slash if present
          URL="${URL%/}"

          echo "Pinging ${URL}/ping (max-time: 90s) ..."
          STATUS=$(curl -s -L -o /dev/null -w "%{http_code}" --max-time 90 --retry 2 --retry-delay 5 "${URL}/ping")
          echo "Response HTTP code: ${STATUS}"

          if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 400 ]; then
            echo "Server is awake and healthy (HTTP ${STATUS})!"
            exit 0
          fi

          echo "Ping endpoint returned ${STATUS}. Trying fallback /health ..."
          STATUS_HEALTH=$(curl -s -L -o /dev/null -w "%{http_code}" --max-time 90 "${URL}/health")
          echo "Health HTTP code: ${STATUS_HEALTH}"

          if [ "$STATUS_HEALTH" -ge 200 ] && [ "$STATUS_HEALTH" -lt 400 ]; then
            echo "Server is awake via /health!"
            exit 0
          fi

          echo "Failed to reach server (status: ${STATUS_HEALTH})"
          exit 1

