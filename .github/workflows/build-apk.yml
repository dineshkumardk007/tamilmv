name: Build Android TV & Mobile APK

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
      - 'static/**'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type (debug / release)'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

jobs:
  build-apk:
    name: Build APK via Gradle
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Generate Gradle Wrapper & Build Debug APK
        working-directory: ./android
        run: |
          echo "Generating Gradle Wrapper..."
          gradle wrapper --gradle-version 8.2
          chmod +x gradlew
          echo "Building Android TV APK (assembleDebug)..."
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify APK Output
        run: |
          if [ -f "android/app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "Debug APK built successfully!"
            cp android/app/build/outputs/apk/debug/app-debug.apk SDK-Movies-AndroidTV-v1.0.apk
            ls -lh SDK-Movies-AndroidTV-v1.0.apk
          else
            echo "Error: Output APK not found!"
            find android/app/build -name "*.apk"
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SDK-Movies-AndroidTV-v1.0-APK
          path: SDK-Movies-AndroidTV-v1.0.apk
          if-no-files-found: error
          retention-days: 30
